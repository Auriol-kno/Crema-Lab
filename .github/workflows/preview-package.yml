name: Crema Lab preview package
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preview-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build portable preview without production publishing
        run: npx vite build --base=./
      - uses: actions/upload-artifact@v4
        with:
          name: crema-lab-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
